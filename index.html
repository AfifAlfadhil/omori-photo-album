<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">

    <title>PHOTO ALBUM | OMORI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Redacted+Script&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Lobster&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: #fff;
            /* sumber: https://www.deviantart.com/carlyissleepy/art/Omori-background-fan-art-%3AD-922734588 */
            background-image: url('images/background.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: bottom center;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .button-container {
            display: flex;
            gap: 10px;
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        .music-button,
        .back-button {
            background: black;
            color: white;
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            width: 50px;
            height: 50px;
            text-align: center;
        }

        .back-button {
            display: none;
        }

        /* Halaman Awal */
        .start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            height: 100vh;
            justify-content: center;
            padding-inline: clamp(20px, 60px, 100px);
        }

        /* Pilihan sampul album */
        .cover-row {
            display: flex;
            gap: clamp(12px, 3vw, 36px);
            margin-top: 10px;
        }

        .cover {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.3s;
            font-family: "Gloria Hallelujah", cursive;
            font-weight: bold;
            font-size: clamp(11px, 1.4vw, 15px);
        }

        .cover img {
            width: clamp(70px, 12vw, 130px);
            height: auto;
            filter: drop-shadow(3px 3px 6px rgba(0, 0, 0, 0.5));
        }

        .cover span {
            background: white;
            border: 2px solid black;
            border-radius: 8px;
            padding: 2px 8px;
            transition: background 0.3s, color 0.3s;
        }

        .cover:hover {
            transform: scale(1.1);
        }

        .cover:hover span {
            background: black;
            color: white;
        }

        /* Judul */
        .start-title {
            font-size: clamp(36px, 6vw, 70px);
            font-weight: bold;
            margin-bottom: 10px;
            font-family: "Lobster", cursive;
            color: rgb(235, 235, 25);
            text-shadow:
                -2px -2px 0 black,
                2px -2px 0 black,
                -2px 2px 0 black,
                2px 2px 0 black;
        }

        /* Deskripsi */
        .start-desc {
            font-size: clamp(15px, 2vw, 20px);
            margin-bottom: 30px;
            font-family: "Gloria Hallelujah", cursive;
            font-style: italic;
            font-weight: bold;
            color: black;
            background: white;
            border: 3px solid black;
            padding: 5px 15px;
            border-radius: 10px;
        }

        .start-button {
            width: clamp(80px, 8vw, 120px);
            height: clamp(80px, 8vw, 120px);
            background: white;
            color: black;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Gloria Hallelujah", cursive;
            font-size: clamp(15px, 2vw, 20px);
            font-weight: bold;
            cursor: pointer;
            border: 3px solid black;
            transition: transform 0.3s, background 0.3s, box-shadow 0.3s;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }

        /* Efek Hover */
        .start-button:hover {
            transform: scale(1.1);
            background: black;
            color: white;
            box-shadow: 0px 6px 15px rgba(0, 0, 0, 0.3);
        }

        /* Efek Animasi Masuk */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cover-row,
        .start-title,
        .start-desc {
            animation: fadeIn 1s ease-in-out;
        }

        /* Album */
        .album-container {
            display: none;
            align-items: center;
            justify-content: flex-start;
            overflow: auto;
            padding-inline: clamp(50px, 100px, 150px);
        }

        .navigation {
            padding: 15px 25px;
            font-size: 18px;
            cursor: pointer;
            background: rgb(0, 0, 0);
            color: rgb(255, 255, 255);
            margin: 20px;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }

        .album {
            display: flex;
            background: #f4f4f4;
            border: 3px solid #000;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.2);
            width: 840px;
            height: 600px;
            position: relative;
            flex-shrink: 0;
            margin-left: auto;
            margin-right: auto;
            margin-top: 20px;
        }

        .page {
            width: 50%;
            margin-inline: 20px;
            display: flex;
            padding-inline: 10px;
            padding-block: 30px;
            flex-direction: column;
            justify-content: space-between;
        }

        .divider {
            width: 3px;
            background: #b4b4b4;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 1);
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
        }

        .photo-entry {
            display: flex;
            align-items: center;
        }

        .photo {
            width: 130px;
            height: 156px;
            background: #f4f4f4;
            margin: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
        }

        .caption {
            font-family: "Gloria+Hallelujah", cursive;
            font-size: 12px;
            text-align: left;
            max-width: 200px;
            margin-left: 10px;
        }

        .scribbled-text {
            font-family: 'Redacted Script', cursive;
            font-size: 20px;
            font-weight: normal;
        }
    </style>
</head>

        let pages = albums.faraway;

        function updatePhotos() {
            const leftPage = document.getElementById('page-left');
            const rightPage = document.getElementById('page-right');
            leftPage.innerHTML = '';
            rightPage.innerHTML = '';

            pages[currentPage].left.forEach((photo, index) => {
                leftPage.innerHTML += `
                    <div class="photo-entry" style="flex-direction: ${index % 2 === 0 ? 'row' : 'row-reverse'};">
                        
                        ${photo.src ? `<a class="photo"><img src="${photo.src}" alt="Photo"></a>` : `<a class="photo"></a>`}
                        
                        <div class="caption">
                            <strong>${photo.title}</strong><br>
                            ${photo.desc}
                        </div>
                    </div>
                `;
            });

            pages[currentPage].right.forEach((photo, index) => {
                rightPage.innerHTML += `
                    <div class="photo-entry" style="flex-direction: ${index % 2 === 0 ? 'row' : 'row-reverse'};">
                        
                        ${photo.src ? `<a class="photo"><img src="${photo.src}" alt="Photo"></a>` : `<a class="photo"></a>`}
                        
                        <div class="caption">
                            <strong>${photo.title}</strong><br>
                            ${photo.desc}
                        </div>
                    </div>
                `;
            });
        }

        function nextPage() {
            if (currentPage < pages.length - 1) {
                currentPage++;
                updatePhotos();
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                updatePhotos();
            }
        }

        function openAlbum(key) {
            pages = albums[key];
            currentPage = 0;
            startAlbum();
        }

        function startAlbum() {
            document.querySelector('.start-screen').style.display = 'none';
            document.querySelector('.album-container').style.display = 'flex';
            document.querySelector('.back-button').style.display = "block";
            updatePhotos();
        }

        function goBack() {
            document.querySelector('.album-container').style.display = 'none';
            document.querySelector('.start-screen').style.display = 'flex';
            document.querySelector('.back-button').style.display = "none";
        }

        // Background Music
        function toggleMusic() {
            var audio = document.getElementById("background-music");
            var musicButton = document.getElementById("musicButton");
            if (audio.paused) {
                audio.play();
                musicButton.textContent = "🔊";
            } else {
                audio.pause();
                musicButton.textContent = "🔇";
            }
        }

        // Memulai musik setelah halaman dimuat (jika diizinkan oleh browser)
        window.onload = function () {
            var audio = document.getElementById("background-music");
            audio.play().catch(error => console.log("Autoplay diblokir oleh browser:", error));
        };

        updatePhotos();
    </script>
